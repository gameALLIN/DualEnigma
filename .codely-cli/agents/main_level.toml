```csharp
namespace DualEnigma.Level
{
    public class LevelData
    {
        public string LevelId;          // "1-1-1"
        public int Chapter;             // 1-3
        public int Section;             // 1-4
        public int Round;               // 1-3
        public string DisasterId;       // "E1"
        public ShelterEnvironment Env;  // 火山/洪水/暴风雪/地震/陨石
