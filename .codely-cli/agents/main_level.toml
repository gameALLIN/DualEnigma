## 地图与蓝图

### 地图参数

- **地图尺寸**: 40×20格 (1280×640px)
- **建筑区域**: 15×8格 (480×256px)，居中
- **合成台**: 建筑区域内中心
- **碎片掉落区**: 建筑区域外
- **PPU**: 32

### 蓝图配置规则

| 轮次 | 蓝图块数 | 复杂度 |
|------|---------|--------|
| 轮次1 | 3-4块 | 简单形状（直线、L形） |
| 轮次2 | 5-6块 | 中等形状（T形、十字） |
| 轮次3 | 7-8块 | 复杂形状（多层、错位） |
| 3-4-3 | 9-10块 | 最终关强化 |

### 蓝图位置规则

- 蓝图出现在建筑区域内（安全区）
- 蓝图位置由关卡系统根据灾害类型动态生成
- 蓝图显示：绿色高亮区域 + 材料图标 + 数量标注

## 碎片掉落配置

| 阶段 | 碎片数量 | 说明 |
|------|---------|------|
| 预告(5秒) | 3-5个 | 预热 |
| 碎片收集(20秒) | 25-35个 | 主要收集 |
| 其他阶段 | 0 | 停止掉落 |

碎片掉落位置：靠近灾害方向掉落更多对应碎片

