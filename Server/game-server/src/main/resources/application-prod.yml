spring:
  datasource:
    url: jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

# account-server 地址（Docker compose 服务名）
dualenigma:
  account-server-url: http://accountserver:8081

logging:
  level:
    com.dualenigma.server: INFO
    org.springframework.web.socket: WARN
    root: WARN
