spring:
  datasource:
    url: jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

# game-server 地址（Docker compose 服务名）
dualenigma:
  game-server-url: http://gameserver:8080

logging:
  level:
    com.dualenigma.accountserver: INFO
    root: WARN
