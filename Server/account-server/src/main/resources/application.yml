server:
  port: 8081

spring:
  application:
    name: dualenigma-account-server

  datasource:
    url: jdbc:mariadb://localhost:3306/dualenigma
    username: dualenigma
    password: dualenigma_dev
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect

# JWT 配置
dualenigma:
  jwt:
    secret: dualenigma_default_secret_key_change_in_production_2026
    expiration-hours: 24

logging:
  level:
    com.dualenigma.accountserver: DEBUG
    org.springframework.web: DEBUG
